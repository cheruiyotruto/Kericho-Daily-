name: Deploy static preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare demo database
        env:
          DJANGO_SECRET_KEY: pages-build-only-not-a-production-secret
          DJANGO_DEBUG: "1"
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo

      - name: Import current headlines
        env:
          DJANGO_SECRET_KEY: pages-build-only-not-a-production-secret
          DJANGO_DEBUG: "1"
        run: python manage.py import_current_news --limit 24

      - name: Build static preview
        env:
          DJANGO_SECRET_KEY: pages-build-only-not-a-production-secret
          DJANGO_DEBUG: "1"
          SITE_URL: https://cheruiyotruto.github.io/Kericho-Daily-
          SHOW_DEMO_BANNER: "0"
          STATIC_PREVIEW_PREFIX: /Kericho-Daily-
        run: python manage.py build_static_preview --output site-build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
