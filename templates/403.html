<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>403 Forbidden | Kericho Daily</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --red:#e11d24; --ink:#14181d; --muted:#626d78; --line:#e3e6ea; --bg:#f4f5f7; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,Arial,sans-serif; display:grid; place-items:center; min-height:100vh; padding:24px; }
    .box { background:#fff; border:1px solid var(--line); border-top:4px solid var(--red); max-width:560px; width:100%; padding:48px 40px; text-align:center; }
    .code { font:900 5rem/1 Roboto,Arial,sans-serif; letter-spacing:-.06em; color:var(--red); margin:0; }
    h1 { font:900 1.5rem/1.2 Roboto,Arial,sans-serif; text-transform:uppercase; margin:10px 0 12px; }
    p { color:var(--muted); margin:0 0 26px; }
    a { display:inline-block; background:var(--red); color:#fff; font:800 .78rem/1 Roboto,Arial,sans-serif; text-transform:uppercase; letter-spacing:.05em; padding:13px 22px; text-decoration:none; }
    a:hover { background:#b81218; }
  </style>
</head>
<body>
  <div class="box">
    <p class="code">403</p>
    <h1>Access denied</h1>
    <p>You don't have permission to view this page. If you believe this is an error, please contact the newsroom.</p>
    <a href="/">Back to Kericho Daily</a>
  </div>
</body>
</html>
